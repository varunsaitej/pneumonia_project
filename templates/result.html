<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pneumonia Detection Result</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #ffffff);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #00796b;
            margin-bottom: 10px;
        }

        .prediction {
            font-size: 24px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .positive {
            background-color: #ffebee;
            color: #c62828;
        }

        .negative {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .images {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .image-box {
            flex: 1;
            min-width: 250px;
        }

        img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn {
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #00796b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #004d40;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Pneumonia Detection Result</h1>

        <!-- Dynamic Prediction Styling -->
        <div class="prediction {% if 'Pneumonia' in prediction %}positive{% else %}negative{% endif %}">
            {{ prediction }}
        </div>

        <div class="images">
            <div class="image-box">
                <h3>Original Image</h3>
                <img src="{{ original }}" alt="Original Image">
            </div>

            <div class="image-box">
                <h3>YOLO Detection</h3>
                <img src="{{ detected }}" alt="Detected Image">
            </div>
        </div>

        <a href="/" class="btn">Try Another Image</a>
    </div>
</body>
</html>
